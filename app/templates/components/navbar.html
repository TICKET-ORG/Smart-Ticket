{% from "components/icons.html" import icon with context %}
<header class="site-header" data-site-header data-nav-open="false">
  <div class="container site-header__inner">
    <a class="brand" href="/" aria-label="SmartTicket home">
      <span class="brand__mark">{{ icon("ticket") }}</span>
      <span class="brand__name">smartticket</span>
    </a>

    <nav class="site-nav" id="primary-navigation" aria-label="Primary">
      <a href="/events" {% if active_page == "events" %}aria-current="page"{% endif %}>Events</a>
      <a href="/#how-it-works" {% if active_page == "how-it-works" %}aria-current="page"{% endif %}>How it works</a>
      <a href="/#method" {% if active_page == "method" %}aria-current="page"{% endif %}>Method</a>
    </nav>

    <div class="site-header__actions">
      <a class="btn btn--ghost btn--sm" href="/auth/login">Sign in</a>
      <a class="btn btn--primary btn--sm" href="/events">Browse events</a>
      <button
        class="nav-toggle"
        type="button"
        data-nav-toggle
        aria-expanded="false"
        aria-controls="primary-navigation"
        aria-label="Open menu"
      >
        <span class="nav-toggle__open">{{ icon("menu") }}</span>
        <span class="nav-toggle__close">{{ icon("x") }}</span>
      </button>
    </div>
  </div>
</header>
